name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-validate:
    name: Test and Validate Quality Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Quality Guardrails
        run: |
          chmod +x scripts/check.sh tests/run_tests.py
          ./scripts/check.sh

  build-linux:
    name: Build Linux Distribution
    needs: [test-and-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Linux Tarball
        run: |
          mkdir -p dist
          tar -czf dist/loqer-linux-x64.tar.gz \
            --transform 's,^,loqer/,' \
            assets bin configs systemd ui install.sh uninstall.sh LICENSE README.md

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loqer-linux-x64
          path: dist/loqer-linux-x64.tar.gz

  build-windows:
    name: Build Windows x64 Distribution
    needs: [test-and-validate]
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install System Dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git \
            cmake \
            make \
            python3 \
            upx \
            mingw64-gcc-c++ \
            mingw64-filesystem \
            mingw64-qt6-qtbase \
            mingw64-qt6-qtdeclarative \
            mingw64-qt6-qt5compat \
            mingw64-qt6-qtshadertools \
            mingw64-qt6-qtsvg \
            binutils

      - name: Fix Safe Directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Package Windows Executable
        run: |
          chmod +x build-windows.sh scripts/package-windows.py
          ./build-windows.sh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loqer-windows-x64
          path: dist/loqer-windows-x64.zip

  publish-release:
    name: Publish Release Assets
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: loqer-linux-x64
          path: dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: loqer-windows-x64
          path: dist

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/loqer-linux-x64.tar.gz \
            dist/loqer-windows-x64.zip \
            --clobber
